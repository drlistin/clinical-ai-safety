name: Search foundations checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:safety
      - run: node --test tests/safety-case-pack.test.cjs
      - run: node --test tests/safety-real-world-register.test.cjs
      - run: node --test tests/safety-trace-independence.test.cjs
      - run: node --test tests/safety-adjudication-package.test.cjs
      - run: npm run build
