name: Prepare dependency lock for Next.js 16

on:
  push:
    branches:
      - maintenance/next16-security-20261114

permissions:
  contents: write

jobs:
  update-lock:
    if: startsWith(github.event.head_commit.message, 'Upgrade Next.js 16 dependencies')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve exact dependencies and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile to maintenance branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Lock Next.js 16 security upgrade dependencies"
          git push origin HEAD:maintenance/next16-security-20261114
      - run: npm ci
      - run: npm run lint
      - run: npm run build
