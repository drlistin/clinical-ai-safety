name: Prepare approved governance image

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-image:
    if: github.head_ref == 'design/homepage-assurance-preview-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare cropped illustrative image
        shell: bash
        run: |
          python -m pip install --quiet pillow
          curl --fail --location --silent --show-error --retry 2 'https://at.adobe.com/DcP0N8Xf0Zhb9Sw1' --output /tmp/source-governance
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/source-governance').convert('RGB')
          assert im.width >= 1650 and im.height >= 900, f'Unexpected asset dimensions: {im.size}'
          im = im.crop((830, 145, 1640, 682))
          im = im.resize((1056, 700), Image.Resampling.LANCZOS)
          im.save('public/governance-hero.webp', 'WEBP', quality=76, method=6)
          print('Approved governance photograph prepared')
          PY
      - name: Commit only image to design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/governance-hero.webp
          git diff --cached --quiet || git commit -m "Add approved governance illustration as optimised WebP"
          git push origin HEAD:design/homepage-assurance-preview-20261114
